<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — SERVIX</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/QxPKh1kx/83fb69c1-108b-4dad-8e00-5b7ead62e1db.png" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="https://i.postimg.cc/QxPKh1kx/83fb69c1-108b-4dad-8e00-5b7ead62e1db.png" alt="SERVIX" />
      <span>SERVIX</span>
    </a>
    <nav class="nav">
      <a href="index.html">Cadastro</a>
    </nav>
  </div>
</header>

<main class="login-main">
  <div class="login-card">
    <div class="login-tabs">
      <button type="button" class="login-tab is-active" data-tipo="cliente">Cliente</button>
      <button type="button" class="login-tab" data-tipo="profissional">Profissional</button>
      <button type="button" class="login-tab" data-tipo="admin">Admin</button>
      <button type="button" class="login-tab" data-tipo="admin-pro">Admin PRO</button>
    </div>

    <div id="alerta" class="alerta" style="display: none;"></div>

    <h2 id="login-titulo">Entrar como cliente</h2>
    <p id="login-subtitulo" style="margin-bottom: 24px;">Acesse sua conta para solicitar serviços.</p>

    <form id="form-login" novalidate>
      <div class="field" data-field="email">
        <label for="email">E-mail <span class="required">*</span></label>
        <input type="email" id="email" placeholder="voce@email.com" required autocomplete="email" />
        <small class="erro-msg"></small>
      </div>

      <div class="field" data-field="senha">
        <label for="senha">Senha <span class="required">*</span></label>
        <input type="password" id="senha" placeholder="Sua senha" required autocomplete="current-password" />
        <small class="erro-msg"></small>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-enviar">
        <span class="btn-text">Entrar</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="login-footer">
      Não tem conta?
      <a href="index.html">Sou profissional</a> ·
      <a href="cadastro-cliente.html">Sou cliente</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="ano"></span> SERVIX. Todos os direitos reservados.</p>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/login.js"></script>
</body>
</html>
